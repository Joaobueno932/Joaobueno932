<rect x="970" y="84" rx="10" width="160" height="46" fill="#123343" stroke="#337d85"/><text x="1050" y="113" text-anchor="middle" class="sans" fill="#a9e7e0" font-size="15">AUTOMAÇÃO</text>
<rect x="1013" y="290" rx="10" width="114" height="40" fill="#123343" stroke="#337d85"/><text x="1070" y="315" text-anchor="middle" class="sans" fill="#a9e7e0" font-size="14">DADOS</text></g>
<text x="56" y="391" class="sans" fill="#6f9fa9" font-size="15" letter-spacing="2">SISTEMAS • INTEGRAÇÕES • INTELIGÊNCIA ARTIFICIAL</text>
