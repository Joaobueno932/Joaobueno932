<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="João Lucas Pinheiro, Engenheiro da Computação e Desenvolvedor de Software">
<style>
  .serif{font-family:Georgia,'Times New Roman',serif} .sans{font-family:Arial,Helvetica,sans-serif}
  .line{stroke:#2a5260;stroke-width:1.5;fill:none}.node{fill:#0e2a36;stroke:#4dc5c2;stroke-width:1.5}
  .glow{animation:fade 4s ease-in-out infinite alternate}.slide{animation:appear 1.2s ease-out both}.sl2{animation:appear 1.4s .2s ease-out both}.dot{animation:blink 2s ease-in-out infinite alternate}
  @keyframes fade{from{opacity:.35}to{opacity:1}}@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{from{opacity:.25}to{opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="name-reveal-1"><rect x="48" y="147" width="0" height="75"><animate attributeName="width" from="0" to="590" dur="1.45s" begin="0.25s" fill="freeze" /></rect></clipPath><clipPath id="name-reveal-2"><rect x="48" y="218" width="0" height="77"><animate attributeName="width" from="0" to="590" dur="1.30s" begin="1.78s" fill="freeze" /></rect></clipPath></defs>
<rect width="1200" height="430" rx="18" fill="#081924"/>
<path d="M0 350 L1200 350 M0 385 L1200 385" stroke="#193847" opacity=".6"/>
<path d="M38 28 H1160" stroke="#286271"/><circle cx="48" cy="28" r="4" fill="#47d6c4"/>
<text x="67" y="34" class="sans" fill="#8dabb7" font-size="15" letter-spacing="2">PERFIL PROFISSIONAL</text><text x="1120" y="34" text-anchor="end" class="sans" fill="#8dabb7" font-size="14">BRASIL · MS</text>

<g>
<text x="56" y="126" class="sans" fill="#46d6c4" font-size="18" letter-spacing="3">ENGENHARIA DE SOFTWARE</text>
<text x="52" y="202" class="serif" font-size="65" fill="#f5f6f3" clip-path="url(#name-reveal-1)">João Lucas</text>
<text x="52" y="272" class="serif" font-size="65" fill="#f5f6f3" clip-path="url(#name-reveal-2)">Pinheiro<tspan fill="#4dd1c4">.</tspan></text>
</g>
<g class="sl2"><text x="56" y="319" class="sans" fill="#b8cbd1" font-size="20">Engenheiro da Computação  /  Backend &amp; Full Stack</text></g>
